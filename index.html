<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question ❤️</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="date-box">

            <div class="heart">❤️</div>

            <h1>Will you go on a date with me?</h1>

            <p>I have a very important question for you...</p>

            <div class="buttons">
                <button id="yesBtn" class="btn btn-success">
                    YES 
                </button>

                <button id="noBtn" class="btn btn-danger">
                    NO 
                </button>
            </div>

            <p id="message"></p>

        </div>
    </div>

    <script>
        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");
        const message = document.getElementById("message");

        let noSize = 18;
        let clicks = 0;

        yesBtn.addEventListener("click", function() {

            noBtn.style.display = "none";
            yesBtn.style.display = "none";
            message.innerHTML = "YAY! ❤️ I can't wait for our date! 🥰";
        });

        noBtn.addEventListener("click", function() {

            clicks++;

        let yesScale = 1 + (clicks * 0.3);
        yesBtn.style.transform = `scale(${yesScale})`;

        let noScale = 1 - (clicks * 0.15);

        if (noScale < 0.2) {
        noScale = 0.2;
        }

        noBtn.style.transform = `scale(${noScale})`;

                if (clicks == 1) {
                noBtn.innerHTML = "Are you sure? 🥺";
            } 
            else if (clicks == 2) {
                noBtn.innerHTML = "Really? 😭";
            } 
            else if (clicks == 3) {
                noBtn.innerHTML = "PLEASE 😭❤️";
            } 
            else if (clicks >= 4) {
                noBtn.innerHTML = "NO WAY 😭";
            }
        
                const x = Math.random() * (window.innerWidth - 150);
                const y = Math.random() * (window.innerHeight - 100);

                noBtn.style.position = "fixed";
                noBtn.style.left = x + "px";
                noBtn.style.top = y + "px";  
                yesBtn.style.fontSize = "100px";
            

    
        });
    </script>

</body>
</html>
